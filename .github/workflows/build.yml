name: Build RIO BOARD APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare signing key (optional)
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/rio.keystore"
            echo "RIO_KS_FILE=$RUNNER_TEMP/rio.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          gradle assembleDebug --stacktrace \
            -PRIO_VERCODE=${{ github.run_number }} \
            -PRIO_VERNAME=1.0.${{ github.run_number }} \
            ${RIO_KS_FILE:+-PRIO_KS_FILE=$RIO_KS_FILE} \
            ${KS_PASSWORD:+-PRIO_KS_PASS=$KS_PASSWORD}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RIO-BOARD.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RIO-BOARD-apk
          path: RIO-BOARD.apk

      - name: Publish release (easy download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: RIO BOARD v${{ github.run_number }}
          files: RIO-BOARD.apk
