<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIO BOARD Admin</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#16181d;--mut:#667085;--line:#e1e4ea;--acc:#3b82f6;--accink:#fff;--bad:#d92d20;--ok:#12803c;--field:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#101218;--card:#181b23;--ink:#eef0f6;--mut:#98a2b3;--line:#2a2f3b;--acc:#5b9bff;--accink:#0b1220;--bad:#ff6b5e;--ok:#4cd484;--field:#10131a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:140px}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.ok{color:var(--ok);border-color:var(--ok)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:10px;cursor:pointer}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.del{color:var(--bad)}
button:disabled{opacity:.5}
nav{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto}
nav button{border-radius:10px 10px 0 0;border-bottom:none}
nav button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
main{padding:14px;max-width:1100px;margin:0 auto}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:820px){.grid{grid-template-columns:260px 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.item{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.item.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.item small{color:var(--mut);display:block}
.item.off{opacity:.55}
.dots{display:flex}.dots i{width:14px;height:14px;border-radius:50%;margin-right:-4px;border:1px solid rgba(128,128,128,.4)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.crow{display:grid;grid-template-columns:110px 44px 1fr;gap:8px;align-items:center;margin-top:6px}
.crow span{font-size:13px}
input[type=color]{width:44px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hint{color:var(--mut);font-size:13px;margin:6px 0}
.pv{border-radius:14px;padding:8px;max-width:420px;margin:8px 0}
.pbar{font-size:13px;padding:2px 6px 8px}
.pr{display:flex;gap:4px;margin-bottom:5px;justify-content:center}
.pk{flex:1;max-width:38px;min-width:0;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}
.pk.w{flex:2;max-width:76px}.pk.sp{flex:5;max-width:170px;font-size:11px}
.news{border-radius:12px;padding:10px 12px;margin:6px 0;border:1px solid var(--line)}
.news b{display:block}.news small{color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:520px;width:calc(100% - 24px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sec{font-weight:600;margin:14px 0 6px;font-size:14px}
.tag{font-size:11px;color:var(--mut)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.bcard img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--field)}
.bcard .bi{padding:6px 8px;font-size:13px}
.bcard.off img{opacity:.3}
.bcard input[type=text]{padding:5px 7px;font-size:13px}
.bcard .chk{margin:4px 0 0;font-size:12px}
.bcard button{padding:4px 8px;font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0 14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.warn i{background:var(--bad)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.pgrid .st{position:relative;border:1px solid var(--line);border-radius:10px;aspect-ratio:1;background:var(--field);overflow:hidden}
.pgrid .st img{width:100%;height:100%;object-fit:contain}
.pgrid .st button{position:absolute;top:2px;right:2px;padding:0 6px;font-size:12px;border-radius:99px}
.emo{font-size:24px;line-height:1.5;word-break:break-all}
code{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:1px 5px;word-break:break-all}
</style>
</head>
<body>
<header>
  <h1>RIO BOARD · Admin</h1>
  <span id="status" class="pill">not loaded</span>
  <button id="bLoad">Reload</button>
  <button id="bSet">⚙ GitHub</button>
  <button id="bPub" class="pri">Publish</button>
</header>
<nav id="tabs"></nav>
<main id="view"></main>

<dialog id="dlg">
  <h3 style="margin-top:0">GitHub connection</h3>
  <p class="hint">The admin saves <code>config.json</code> into your repo. The keyboard reads it from your GitHub Pages site. Your token stays in this browser only and is sent only to api.github.com.</p>
  <label>GitHub username (owner)</label><input type="text" id="sOwner" autocomplete="off">
  <label>Repository name</label><input type="text" id="sRepo" autocomplete="off">
  <label>Branch</label><input type="text" id="sBranch" autocomplete="off">
  <label>File path in the repo</label><input type="text" id="sPath" autocomplete="off">
  <label>Token (fine-grained, this repo only, Contents: read and write)</label><input type="password" id="sToken" autocomplete="off">
  <p class="hint">Link to put in the app (<code>RemoteConfig.kt</code>):<br><code id="sUrl"></code></p>
  <div class="btns"><button id="sSave" class="pri">Save</button><button id="sClose">Close</button></div>
</dialog>

<script>
//#pure-start
const KEYS=['bg','key','special','accent','active','pressed','text','hint','snow'];
const LABELS={bg:'Background',key:'Keys',special:'Special keys',accent:'Enter / accent',active:'Active key',pressed:'Pressed key',text:'Text',hint:'Hint text',snow:'Effect colour'};
const PRESETS={
 Dark:['#17181C','#2B2D35','#3A3D49','#3B82F6','#6D5BD0','#5A5F73','#FFFFFF','#9AA3C0','#FFFFFF'],
 Midnight:['#0B1026','#18204A','#232C63','#00B4D8','#7B2CBF','#3A4690','#FFFFFF','#8FA3FF','#DDEBFF'],
 Forest:['#0F1F17','#1C3A2A','#26503A','#2ECC71','#F39C12','#3F7A58','#FFFFFF','#9BD6B0','#FFFFFF'],
 Rose:['#2A1220','#4A2038','#63304D','#FF4D8D','#B84DFF','#8A3F67','#FFFFFF','#F5A9CC','#FFE8F2'],
 Ocean:['#06202B','#0E3A4D','#16526B','#00C2A8','#3B82F6','#2A7A99','#FFFFFF','#8CD3E6','#E6FBFF'],
 Sunset:['#2B1408','#4D2A12','#6A3A1A','#FF7A18','#E8478B','#8F5A30','#FFFFFF','#F2B88A','#FFF1E0'],
 Purple:['#1B1030','#2F1D54','#432A78','#A855F7','#EC4899','#6A4DA8','#FFFFFF','#C4A8F0','#F3E8FF'],
 Light:['#E8EAF0','#FFFFFF','#C9CEDB','#3B82F6','#7C6CE0','#B8BFD3','#111111','#5B6382','#8FB8FF']
};
const LIVE={
 Aurora:['#07111F','#99101C33','#B01A2A48','#4DFFB5','#8E6BFF','#CC2E4A78','#FFFFFF','#A8C7E8','#CFFFEF'],
 Galaxy:['#0B0720','#99181033','#B0261A4D','#B388FF','#FF6EC7','#CC4A3A8F','#FFFFFF','#C3B5F0','#FFFFFF'],
 Lava:['#1A0606','#99360E0A','#B0501810','#FF7A18','#FF3D71','#CC8A3A20','#FFFFFF','#FFC9A8','#FFE0C0'],
 Neon:['#070617','#990B0A2A','#B0161448','#00E5FF','#FF2EE6','#CC3A38A8','#FFFFFF','#A8B8FF','#CFF8FF'],
 Waves:['#04202E','#990A3446','#B0104A63','#26E0D0','#4DA3FF','#CC2A7A99','#FFFFFF','#9AD7EA','#E6FBFF'],
 Matrix:['#020A04','#99061A0C','#B0092A12','#00FF66','#B6FF3B','#CC127A33','#D6FFE0','#6BE08A','#7CFFB2'],
 RGB:['#101018','#99181822','#B0242434','#FF4D8D','#4DA3FF','#CC4A4A66','#FFFFFF','#C8C8E0','#FFFFFF']
};
// what the app ships with today (names must match the app)
const BUILTIN_THEMES=[].concat(
 Object.keys(PRESETS).map(n=>({name:n,kind:'Classic',c:PRESETS[n]})),
 [{name:'Auto',kind:'Follows the phone (dark / light)',c:PRESETS.Dark},{name:'Material You',kind:'Wallpaper colours (Android 12+)',c:PRESETS.Purple}],
 Object.keys(LIVE).map(n=>({name:n,kind:'Animated',c:LIVE[n]}))
);
const BUILTIN_BG=[['Panda glow','panda_glow.jpg'],['Bamboo panda','panda_bamboo.jpg'],['Bears','bears.jpg'],['Cats','cats.jpg'],['Miku','miku.jpg'],['Zero Two','zero_two.jpg'],['Psycho','psycho.jpg'],['Butterfly','butterfly.jpg']];
const BUILTIN_VID=[['Aurora','aurora'],['Neon waves','neon_waves'],['Starfield','starfield'],['Lava','lava'],['Synthwave','synthwave'],['Bokeh','bokeh'],['Galaxy','galaxy'],['Plasma','plasma']];
const HEX=/^#([0-9a-f]{6}|[0-9a-f]{8})$/i;
function cssColor(hex){
  if(!HEX.test(hex))return 'transparent';
  if(hex.length===7)return hex;
  const a=parseInt(hex.slice(1,3),16)/255;
  return 'rgba('+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16)+','+parseInt(hex.slice(7,9),16)+','+a.toFixed(3)+')';
}
function pickerValue(hex){return HEX.test(hex)?('#'+hex.slice(-6)).toLowerCase():'#000000'}
function withPicker(old,rgb){return(HEX.test(old)&&old.length===9)?('#'+old.slice(1,3)+rgb.slice(1)).toUpperCase():rgb.toUpperCase()}
function slug(s){return(s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30))||'theme'}
function b64enc(str){const b=new TextEncoder().encode(str);let s='';b.forEach(x=>{s+=String.fromCharCode(x)});return btoa(s)}
function b64dec(t){const bin=atob(t.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function newTheme(name,preset){const t={id:'',name:name,enabled:true};KEYS.forEach((k,i)=>{t[k]=PRESETS[preset||'Dark'][i]});return t}
function today(){return new Date().toISOString().slice(0,10)}
function normalize(o){
  const c={version:1,updated:'',themes:[],news:[],update:null,hidden:{themes:[],backgrounds:[],videos:[]},backgrounds:[],videos:[],packs:[],defaults:{rev:0,effect:-1,area:-1,color:-1},languages:{hidden:[]},flags:{disabled:[],minVersion:0,notice:{on:false,id:'',message:''}}};
  if(!o||typeof o!=='object')return c;
  const hs=(o.hidden&&typeof o.hidden==='object')?o.hidden:{};
  ['themes','backgrounds','videos'].forEach(k=>{c.hidden[k]=Array.isArray(hs[k])?hs[k].map(String):[]});
  (Array.isArray(o.backgrounds)?o.backgrounds:[]).forEach(b=>{
    if(!b||typeof b!=='object')return;
    c.backgrounds.push({id:String(b.id||''),name:String(b.name||'Background'),file:String(b.file||''),thumb:String(b.thumb||''),enabled:b.enabled!==false});
  });
  (Array.isArray(o.themes)?o.themes:[]).forEach(t=>{
    if(!t||typeof t!=='object')return;
    const n=newTheme(String(t.name||'Theme'));
    n.id=String(t.id||slug(n.name));n.enabled=t.enabled!==false;
    KEYS.forEach(k=>{if(typeof t[k]==='string')n[k]=t[k]});
    n.name=String(t.name||'Theme');c.themes.push(n);
  });
  (Array.isArray(o.news)?o.news:[]).forEach(x=>{
    if(!x||typeof x!=='object')return;
    c.news.push({id:String(x.id||('n'+Math.random().toString(36).slice(2,8))),title:String(x.title||''),body:String(x.body||''),date:String(x.date||today()),link:String(x.link||''),pinned:!!x.pinned,enabled:x.enabled!==false});
  });
  const toI=(v,d,lo,hi)=>{v=parseInt(v,10);return Number.isFinite(v)?Math.min(hi,Math.max(lo,v)):d};
  (Array.isArray(o.videos)?o.videos:[]).forEach(b=>{
    if(!b||typeof b!=='object')return;
    c.videos.push({id:String(b.id||''),name:String(b.name||'Video'),file:String(b.file||''),thumb:String(b.thumb||''),enabled:b.enabled!==false});
  });
  (Array.isArray(o.packs)?o.packs:[]).forEach(p=>{
    if(!p||typeof p!=='object')return;
    c.packs.push({id:String(p.id||''),name:String(p.name||'Pack'),icon:String(p.icon||'⭐'),type:p.type==='sticker'?'sticker':'emoji',enabled:p.enabled!==false,items:Array.isArray(p.items)?p.items.map(String):[]});
  });
  if(o.defaults&&typeof o.defaults==='object'){
    c.defaults={rev:toI(o.defaults.rev,0,0,1000000),effect:toI(o.defaults.effect,-1,-1,10),area:toI(o.defaults.area,-1,-1,2),color:toI(o.defaults.color,-1,-1,6)};
  }
  if(o.languages&&Array.isArray(o.languages.hidden))c.languages.hidden=o.languages.hidden.map(String);
  if(o.flags&&typeof o.flags==='object'){
    if(Array.isArray(o.flags.disabled))c.flags.disabled=o.flags.disabled.map(String);
    c.flags.minVersion=toI(o.flags.minVersion,0,0,1000000);
    const n=o.flags.notice;
    if(n&&typeof n==='object')c.flags.notice={on:!!n.on,id:String(n.id||''),message:String(n.message||'')};
  }
  if(o.update&&typeof o.update==='object'&&Number(o.update.versionCode)>0){
    c.update={versionCode:Number(o.update.versionCode)|0,versionName:String(o.update.versionName||''),message:String(o.update.message||''),url:String(o.update.url||'')};
  }
  return c;
}
function validate(c){
  const errs=[];const seen=new Set();
  c.themes.forEach((t,i)=>{
    const nm=t.name.trim();
    if(!nm)errs.push('Theme '+(i+1)+': name is empty');
    else if(nm.length>18)errs.push('Theme "'+nm+'": name is longer than 18 letters');
    else if(/^(auto|material you)$/i.test(nm))errs.push('Theme "'+nm+'": that name is used by the app');
    if(seen.has(nm.toLowerCase()))errs.push('Theme "'+nm+'": two themes have the same name');
    seen.add(nm.toLowerCase());
    KEYS.forEach(k=>{if(!HEX.test(t[k]))errs.push('Theme "'+nm+'": '+LABELS[k]+' must look like #RRGGBB')});
  });
  c.news.forEach((n,i)=>{
    if(!n.title.trim())errs.push('News '+(i+1)+': title is empty');
    if(n.link&&!/^https:\/\//i.test(n.link))errs.push('News "'+n.title+'": link must start with https://');
  });
  c.backgrounds.forEach((b,i)=>{
    if(!b.name.trim())errs.push('Background '+(i+1)+': name is empty');
    if(!/^bg\/[A-Za-z0-9._-]{1,80}$/.test(b.file)||b.file.includes('..'))errs.push('Background "'+b.name+'": file path is not valid');
  });
  c.videos.forEach((b,i)=>{
    if(!b.name.trim())errs.push('Video '+(i+1)+': name is empty');
    if(!/^vid\/[A-Za-z0-9._-]{1,80}$/.test(b.file)||b.file.includes('..'))errs.push('Video "'+b.name+'": file path is not valid');
  });
  if(c.videos.length>30)errs.push('Videos: at most 30');
  c.packs.forEach((p,i)=>{
    if(!p.name.trim())errs.push('Pack '+(i+1)+': name is empty');
    if(!p.icon.trim())errs.push('Pack "'+p.name+'": icon is empty');
    if(p.enabled&&!p.items.length)errs.push('Pack "'+p.name+'": it has no items (add some or hide the pack)');
    if(p.items.length>(p.type==='sticker'?40:400))errs.push('Pack "'+p.name+'": too many items');
  });
  if(c.packs.filter(p=>p.enabled).length>4)errs.push('Packs: the keyboard shows at most 4 packs. Hide some.');
  if(c.languages.hidden.length>=8)errs.push('Languages: keep at least one language available');
  if(c.flags.notice.on&&!c.flags.notice.message.trim())errs.push('Notice: write a message or switch it off');
  if(c.flags.notice.message.length>240)errs.push('Notice: at most 240 letters');
  if(c.update){
    if(!(c.update.versionCode>0))errs.push('Update: version code must be a number above 0');
    if(c.update.url&&!/^https:\/\//i.test(c.update.url))errs.push('Update: link must start with https://');
  }
  return errs;
}
function buildJson(c){
  const out={version:1,updated:new Date().toISOString(),themes:[],news:[],update:c.update,
    hidden:{themes:c.hidden.themes.slice(),backgrounds:c.hidden.backgrounds.slice(),videos:c.hidden.videos.slice()},
    backgrounds:c.backgrounds.map(b=>({id:b.id,name:b.name.trim(),file:b.file,thumb:b.thumb,enabled:!!b.enabled})),
    videos:c.videos.map(b=>({id:b.id,name:b.name.trim(),file:b.file,thumb:b.thumb,enabled:!!b.enabled})),
    packs:c.packs.map(p=>({id:p.id,name:p.name.trim(),icon:p.icon.trim(),type:p.type,enabled:!!p.enabled,items:p.items.slice()})),
    defaults:{rev:c.defaults.rev,effect:c.defaults.effect,area:c.defaults.area,color:c.defaults.color},
    languages:{hidden:c.languages.hidden.slice()},
    flags:{disabled:c.flags.disabled.slice(),minVersion:c.flags.minVersion|0,notice:{on:!!c.flags.notice.on,id:c.flags.notice.id,message:c.flags.notice.message.trim()}}};
  const ids=new Set();
  c.themes.forEach(t=>{
    let id=slug(t.name),n=2;while(ids.has(id)){id=slug(t.name)+'-'+(n++)}ids.add(id);
    const o={id:id,name:t.name.trim(),enabled:!!t.enabled};KEYS.forEach(k=>{o[k]=t[k].toUpperCase()});out.themes.push(o);
  });
  out.news=c.news.slice().sort((a,b)=>(b.pinned-a.pinned)||(b.date<a.date?-1:b.date>a.date?1:0)).map(n=>({id:n.id,title:n.title.trim(),body:n.body,date:n.date,link:n.link.trim(),pinned:!!n.pinned,enabled:!!n.enabled}));
  if(!out.update)delete out.update;
  return JSON.stringify(out,null,2)+'\n';
}
function releaseInfo(rel){
  const tag=String(rel.tag_name||'');
  const code=parseInt((tag.match(/(\d+)\s*$/)||[])[1]||'0',10);
  const apk=(rel.assets||[]).find(a=>/\.apk$/i.test(a.name));
  return{versionCode:code,versionName:code?('1.0.'+code):tag.replace(/^v/i,''),url:apk?apk.browser_download_url:''};
}
function uniqueId(base,taken){let id=slug(base),n=2;while(taken.has(id)){id=slug(base)+'-'+(n++)}return id}
//#pure-end

const S={owner:'',repo:'',branch:'main',path:'docs/config.json',token:''};
let cfg=normalize(null),sha=null,dirty=false,tab='themes',selT=0,selN=0,selB=null;
const PREVIEWS=new Map();  // id -> local preview so a new image shows at once
const PENDING=new Map();   // new background images waiting for Publish: id -> {full,thumb,url}
const UPLOADS=new Map();   // other new files waiting for Publish (videos, pack stickers): path below docs/ -> base64
let selP=0;
let DELETE_FILES=[];        // image files in the repo to remove on Publish
const $=s=>document.querySelector(s);

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(k==='class')e.className=v;
    else if(k==='value')e.value=v;
    else if(k==='checked')e.checked=!!v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  kids.flat(Infinity).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(String(c)))});
  return e;
}
function setStatus(t,kind){const s=$('#status');s.textContent=t;s.className='pill'+(kind?' '+kind:'')}
function touch(){dirty=true;setStatus('unsaved changes','bad')}
function loadSettings(){try{Object.assign(S,JSON.parse(localStorage.getItem('rio_admin')||'{}'))}catch(e){}}
function saveSettings(){try{localStorage.setItem('rio_admin',JSON.stringify(S))}catch(e){}}

/* ---------- GitHub ---------- */
function apiUrl(p){p=p||S.path;return 'https://api.github.com/repos/'+encodeURIComponent(S.owner)+'/'+encodeURIComponent(S.repo)+'/contents/'+p.split('/').map(encodeURIComponent).join('/')}
function dirOf(p){const i=p.lastIndexOf('/');return i<0?'':p.slice(0,i+1)}
function hdr(){const x={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(S.token)x.Authorization='Bearer '+S.token;return x}
async function errText(r){let m='';try{m=(await r.json()).message||''}catch(e){}
  if(r.status===401)return 'Token not accepted (401). Make a new token.';
  if(r.status===403)return 'GitHub says no (403): '+m;
  if(r.status===404)return 'Not found (404). Check owner, repository and that the token can see this repo.';
  return 'GitHub error '+r.status+(m?': '+m:'')}
async function ghGet(path){
  const r=await fetch(apiUrl(path)+'?ref='+encodeURIComponent(S.branch),{headers:hdr(),cache:'no-store'});
  if(r.status===404)return{sha:null,text:null};
  if(!r.ok)throw new Error(await errText(r));
  const j=await r.json();
  if(typeof j.content!=='string')throw new Error('File is too big or is a folder.');
  return{sha:j.sha,text:b64dec(j.content)};
}
async function ghPutFile(path,b64,msg){
  const cur=await ghGet(path);
  const r=await fetch(apiUrl(path),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr()),
    body:JSON.stringify({message:msg,content:b64,sha:cur.sha||undefined,branch:S.branch})});
  if(!r.ok)throw new Error(await errText(r));
}
async function ghDeleteFile(path){
  const cur=await ghGet(path);if(!cur.sha)return;
  await fetch(apiUrl(path),{method:'DELETE',headers:Object.assign({'Content-Type':'application/json'},hdr()),
    body:JSON.stringify({message:'Admin: remove background',sha:cur.sha,branch:S.branch})});
}
async function load(){
  if(!S.owner||!S.repo){setStatus('set GitHub first','bad');return}
  if(dirty&&!confirm('You have unsaved changes. Reload and lose them?'))return;
  setStatus('loading…');
  try{
    const g=await ghGet();sha=g.sha;
    cfg=normalize(g.text?JSON.parse(g.text):null);
    PENDING.clear();UPLOADS.clear();DELETE_FILES=[];selP=0;
    selT=0;selN=0;selB=null;dirty=false;
    setStatus(g.text?'loaded':'new file (not on GitHub yet)','ok');draw();
  }catch(e){setStatus(e.message,'bad')}
}
async function publish(){
  const errs=validate(cfg);
  if(errs.length){setStatus(errs[0],'bad');alert(errs.join('\n'));return}
  if(!S.owner||!S.repo||!S.token){openSettings();setStatus('fill GitHub settings first','bad');return}
  const body=buildJson(cfg);
  setStatus('publishing…');$('#bPub').disabled=true;
  try{
    const base=dirOf(S.path);
    const todo=cfg.backgrounds.filter(b=>PENDING.has(b.id));
    let k=0;
    for(const b of todo){
      k++;setStatus('uploading images ('+k+'/'+todo.length+')…');
      const p=PENDING.get(b.id);
      await ghPutFile(base+b.file,p.full,'Admin: add background '+b.name);
      await ghPutFile(base+b.thumb,p.thumb,'Admin: add background thumbnail');
      PENDING.delete(b.id);
    }
    let u=0;
    for(const [path,b64] of [...UPLOADS]){
      u++;setStatus('uploading files ('+u+'/'+UPLOADS.size+')…');
      await ghPutFile(base+path,b64,'Admin: add '+path);
      UPLOADS.delete(path);
    }
    for(const f of DELETE_FILES){try{await ghDeleteFile(f)}catch(e){}}
    DELETE_FILES=[];
    setStatus('saving config…');
    let done=false;
    for(let i=0;i<2&&!done;i++){
      const cur=await ghGet();
      const r=await fetch(apiUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr()),
        body:JSON.stringify({message:'Admin: update config',content:b64enc(body),sha:cur.sha||undefined,branch:S.branch})});
      if(r.ok){sha=(await r.json()).content.sha;done=true}
      else if(r.status===409||r.status===422)continue;
      else throw new Error(await errText(r));
    }
    if(!done)throw new Error('The file changed on GitHub at the same time. Reload and try again.');
    dirty=false;setStatus('published ✔ (app picks it up in a few minutes)','ok');
    if(tab==='raw')draw();
  }catch(e){setStatus(e.message,'bad')}
  $('#bPub').disabled=false;
}

function dots(t){return h('span',{class:'dots'},['bg','key','accent','active'].map(k=>h('i',{style:'background:'+cssColor(t[k])})))}
function preview(t){
  const c=k=>cssColor(t[k]);
  const key=(txt,bg,fg,cls)=>h('div',{class:'pk'+(cls?' '+cls:''),style:'background:'+bg+';color:'+fg},txt);
  const letters=(s,pressedAt)=>[...s].map((l,i)=>key(l,i===pressedAt?c('pressed'):c('key'),c('text')));
  return h('div',{class:'pv',style:'background:'+c('bg')},
    h('div',{class:'pbar',style:'color:'+c('hint')},'📰  😀  🌐  Aa  ⚙   (hint text)'),
    h('div',{class:'pr'},letters('qwertyuiop',9)),
    h('div',{class:'pr'},letters('asdfghjkl')),
    h('div',{class:'pr'},key('⇧',c('special'),c('text'),'w'),letters('zxcvbn'),key('⌫',c('special'),c('text'),'w')),
    h('div',{class:'pr'},key('?123',c('special'),c('text'),'w'),key('සිං',c('active'),c('text'),'w'),key('space',c('key'),c('hint'),'sp'),key('⏎',c('accent'),c('text'),'w')));
}
function colorsOf(arr){const o={};KEYS.forEach((k,i)=>{o[k]=arr[i]});return o}
function isHidden(kind,key){return cfg.hidden[kind].includes(key)}
function setHidden(kind,key,hide){

}

      h('div',{class:'btns'},h('button',{onclick:()=>{const t=newTheme((b.name+' copy').slice(0,18));KEYS.forEach((k,i)=>{t[k]=b.c[i]});cfg.themes.push(t);selT=cfg.themes.length-1;selB=null;touch();draw()}},'Copy colours into a new theme')));

      KEYS.forEach(k=>{

        const pick=h('input',{type:'color',value:pickerValue(t[k])});

/* ---------- backgrounds ---------- */
function blobB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('read failed'));r.readAsDataURL(blob)})}
async function toJpeg(file,maxW,maxH,q){
  const bmp=await createImageBitmap(file);
  const sc=Math.min(1,maxW/bmp.width,maxH/bmp.height);
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('could not convert image')),'image/jpeg',q));
}
async function addImages(files){
  setStatus('preparing images…');
  for(const f of files){
    try{
      const full=await toJpeg(f,1080,1600,.85),thumb=await toJpeg(f,360,360,.8);
      const id=uniqueId((f.name||'bg').replace(/\.[^.]+$/,''),new Set(cfg.backgrounds.map(b=>b.id)))+'-'+Date.now().toString(36).slice(-4);
      cfg.backgrounds.push({id:id,name:(f.name||'Background').replace(/\.[^.]+$/,'').slice(0,30),file:'bg/'+id+'.jpg',thumb:'bg/'+id+'_t.jpg',enabled:true});
      const pu=URL.createObjectURL(thumb);PREVIEWS.set(id,pu);
      PENDING.set(id,{full:await blobB64(full),thumb:await blobB64(thumb),url:pu});
    }catch(e){alert('Could not use “'+f.name+'”: '+e.message)}
  }
  touch();draw();
}
function bgCard(src,name,on,onToggle,extra){
  return h('div',{class:'bcard'+(on?'':' off')},h('img',{src:src,alt:name,loading:'lazy'}),
    h('div',{class:'bi'},extra||name,h('label',{class:'chk'},h('input',{type:'checkbox',checked:on,onchange:e=>onToggle(e.target.checked)}),'Show in the app')));
}
function renderBg(v){
  const own=h('div',{class:'bgrid'});
  cfg.backgrounds.forEach((b,i)=>{
    const src=PREVIEWS.get(b.id)||('../'+b.thumb);
    const nm=h('input',{type:'text',value:b.name,maxlength:30,oninput:e=>{b.name=e.target.value;touch()}});
    const card=bgCard(src,b.name,b.enabled,on=>{b.enabled=on;touch();draw()},h('div',{},nm,h('div',{class:'tag'},PENDING.has(b.id)?'new, uploads when you press Publish':'published')));
    card.querySelector('.bi').append(h('button',{class:'del',onclick:()=>{
      if(!confirm('Delete “'+b.name+'”?'))return;
      if(PENDING.has(b.id))PENDING.delete(b.id);else DELETE_FILES.push(dirOf(S.path)+b.file,dirOf(S.path)+b.thumb);
      cfg.backgrounds.splice(i,1);touch();draw()}},'Delete'));
    own.append(card);
  });
  const pick=h('input',{type:'file',accept:'image/*',multiple:true,style:'display:none',onchange:e=>{addImages([...e.target.files]);e.target.value=''}});
  const photos=h('div',{class:'bgrid'},BUILTIN_BG.map(([n,f])=>bgCard('../builtin/bg/'+f,n,!isHidden('backgrounds',f),on=>{setHidden('backgrounds',f,!on);draw()})));
  const vids=h('div',{class:'bgrid'},BUILTIN_VID.map(([n,id])=>bgCard('../builtin/vid/'+id+'.jpg',n+' ▶',!isHidden('videos',id),on=>{setHidden('videos',id,!on);draw()})));
  v.append(h('div',{class:'card'},
    h('div',{class:'btns',style:'margin:0 0 6px'},h('button',{class:'pri',onclick:()=>pick.click()},'+ Add image'),pick),
    h('p',{class:'hint'},'Images are shrunk automatically (about 1080 px wide) so the keyboard downloads them quickly. They are saved in your repo under docs/bg when you press Publish.'),
    h('div',{class:'sec'},'Added by you'),cfg.backgrounds.length?own:h('p',{class:'hint'},'Nothing yet.'),
    h('div',{class:'sec'},'Built-in photos (untick = remove from the app)'),photos,
    h('div',{class:'sec'},'Built-in animated backgrounds'),vids));
}

/* ---------- videos ---------- */
const MAX_VIDEO=12*1024*1024;
function videoThumb(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const v=document.createElement('video');
    v.muted=true;v.playsInline=true;v.preload='metadata';v.src=url;
    const fail=m=>{URL.revokeObjectURL(url);rej(new Error(m))};
    v.onerror=()=>fail('this browser can not read that video (use an mp4)');
    v.onloadedmetadata=()=>{v.currentTime=Math.min(1,(v.duration||2)/2)};
    v.onseeked=()=>{
      try{
        const sc=Math.min(1,360/(v.videoWidth||360));const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(v.videoWidth*sc));c.height=Math.max(1,Math.round(v.videoHeight*sc));
        c.getContext('2d').drawImage(v,0,0,c.width,c.height);
        c.toBlob(b=>{URL.revokeObjectURL(url);b?res(b):rej(new Error('could not make a preview picture'))},'image/jpeg',.8);
      }catch(e){fail(e.message)}
    };
  });
}
async function addVideos(files){
  for(const f of files){
    try{
      if(f.size>MAX_VIDEO)throw new Error('it is bigger than 12 MB. Use a shorter or smaller clip (loops best at 5–10 seconds).');
      setStatus('preparing video…');
      const thumb=await videoThumb(f);
      const id=uniqueId((f.name||'video').replace(/\.[^.]+$/,''),new Set(cfg.videos.map(b=>b.id)))+'-'+Date.now().toString(36).slice(-4);
      const ext=((/\.(mp4|webm|3gp)$/i.exec(f.name)||[null,'mp4'])[1]).toLowerCase();
      const file='vid/'+id+'.'+ext,tfile='vid/'+id+'_t.jpg';
      cfg.videos.push({id:id,name:(f.name||'Video').replace(/\.[^.]+$/,'').slice(0,24),file:file,thumb:tfile,enabled:true});
      PREVIEWS.set(id,URL.createObjectURL(thumb));PREVIEWS.set(id+':v',URL.createObjectURL(f));
      UPLOADS.set(file,await blobB64(f));UPLOADS.set(tfile,await blobB64(thumb));
    }catch(e){alert('Could not use “'+f.name+'”: '+e.message)}
  }
  touch();draw();
}
function dropUpload(path){if(UPLOADS.has(path))UPLOADS.delete(path);else DELETE_FILES.push(dirOf(S.path)+path)}
function renderVideos(v){
  const own=h('div',{class:'bgrid'});
  cfg.videos.forEach((b,i)=>{
    const src=PREVIEWS.get(b.id)||('../'+b.thumb);
    const nm=h('input',{type:'text',value:b.name,maxlength:24,oninput:e=>{b.name=e.target.value;touch()}});
    const card=bgCard(src,b.name,b.enabled,on=>{b.enabled=on;touch();draw()},h('div',{},nm,h('div',{class:'tag'},UPLOADS.has(b.file)?'new, uploads when you press Publish':'published')));
    card.querySelector('.bi').append(
      h('button',{onclick:()=>{const u=PREVIEWS.get(b.id+':v')||('../'+b.file);window.open(u,'_blank')}},'▶ Play'),' ',
      h('button',{class:'del',onclick:()=>{
        if(!confirm('Delete “'+b.name+'”?'))return;
        dropUpload(b.file);dropUpload(b.thumb);cfg.videos.splice(i,1);touch();draw()}},'Delete'));
    own.append(card);
  });
  const pick=h('input',{type:'file',accept:'video/mp4,video/webm,video/3gpp,video/*',multiple:true,style:'display:none',onchange:e=>{addVideos([...e.target.files]);e.target.value=''}});
  v.append(h('div',{class:'card'},
    h('div',{class:'btns',style:'margin:0 0 6px'},h('button',{class:'pri',onclick:()=>pick.click()},'+ Add video'),pick),
    h('p',{class:'hint'},'Videos play muted and loop behind the keys. Max 12 MB each, short clips (5–10 s, portrait or landscape) work best. They are saved in your repo under docs/vid when you press Publish. The keyboard downloads a video only when a user picks it.'),
    h('div',{class:'sec'},'Added by you ('+cfg.videos.length+'/30)'),cfg.videos.length?own:h('p',{class:'hint'},'Nothing yet.'),
    h('p',{class:'hint'},'The built-in animated backgrounds can be hidden in the Backgrounds tab.')));
}

/* ---------- emoji & sticker packs ---------- */
function packId(t){return t+'-'+Math.random().toString(36).slice(2,7)}
function newPack(type){return{id:packId(type==='sticker'?'stk':'emo'),name:type==='sticker'?'My stickers':'My emoji',icon:type==='sticker'?'🖼':'⭐',type:type,enabled:true,items:[]}}
async function toPng(file,max){
  const bmp=await createImageBitmap(file);const sc=Math.min(1,max/bmp.width,max/bmp.height);
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('could not convert image')),'image/png'));
}
async function stickerBlob(f){
  if(/gif$/i.test(f.type)||/\.gif$/i.test(f.name)){if(f.size>600*1024)throw new Error('the GIF is bigger than 600 KB');return{blob:f,ext:'gif'}}
  for(const px of [512,384,256]){const b=await toPng(f,px);if(b.size<=600*1024)return{blob:b,ext:'png'}}
  throw new Error('the picture is too detailed (over 600 KB)');
}
async function addStickers(p,files){
  for(const f of files){
    if(p.items.length>=40){alert('A sticker pack can hold 40 stickers.');break}
    try{
      setStatus('preparing stickers…');
      const r=await stickerBlob(f);
      const path='packs/'+p.id+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)+'.'+r.ext;
      p.items.push(path);PREVIEWS.set(path,URL.createObjectURL(r.blob));UPLOADS.set(path,await blobB64(r.blob));
    }catch(e){alert('Could not use “'+f.name+'”: '+e.message)}
  }
  touch();draw();
}
function removePackItem(p,i){dropUpload(p.items[i]);p.items.splice(i,1);touch();draw()}
function renderPacks(v){
  const list=h('div',{class:'card'},h('div',{class:'btns',style:'margin:0 0 6px'},
    h('button',{class:'pri',onclick:()=>{cfg.packs.push(newPack('emoji'));selP=cfg.packs.length-1;touch();draw()}},'+ Emoji pack'),
    h('button',{class:'pri',onclick:()=>{cfg.packs.push(newPack('sticker'));selP=cfg.packs.length-1;touch();draw()}},'+ Sticker pack')));
  cfg.packs.forEach((p,i)=>list.append(h('div',{class:'item'+(i===selP?' on':'')+(p.enabled?'':' off'),onclick:()=>{selP=i;draw()}},
    h('span',{style:'font-size:22px'},p.icon),h('div',{},p.name||'(no name)',h('small',{},(p.type==='sticker'?'Stickers':'Emoji')+' · '+p.items.length+(p.enabled?'':' · hidden'))))));
  if(!cfg.packs.length)list.append(h('p',{class:'hint'},'No packs yet. A pack becomes a new tab in the keyboard’s emoji panel (up to 4 packs).'));
  const p=cfg.packs[selP];const ed=h('div',{class:'card'});
  if(!p){ed.append(h('p',{class:'hint'},'Pick a pack on the left or add one. Emoji packs hold emojis or short texts (kaomoji, symbols). Sticker packs hold pictures (PNG/GIF) that users send like stickers.'))}
  else{
    ed.append(
      h('label',{},'Pack name'),h('input',{type:'text',value:p.name,maxlength:24,oninput:e=>{p.name=e.target.value;touch();const it=list.querySelectorAll('.item')[selP];if(it)it.children[1].firstChild.textContent=p.name||'(no name)'}}),
      h('label',{},'Tab icon (one emoji or letter, shown in the emoji panel)'),h('input',{type:'text',value:p.icon,maxlength:4,oninput:e=>{p.icon=e.target.value;touch()}}),
      h('label',{class:'chk'},h('input',{type:'checkbox',checked:p.enabled,onchange:e=>{p.enabled=e.target.checked;touch();draw()}}),'Show this pack in the app'));
    if(p.type==='emoji'){
      const prev=h('div',{class:'emo'},p.items.join(' '));
      const cnt=h('div',{class:'hint'},p.items.length+' / 400');
      ed.append(h('label',{},'Emojis / texts (separate with spaces or new lines, max 16 letters each)'),
        h('textarea',{value:p.items.join(' '),style:'min-height:130px',oninput:e=>{p.items=e.target.value.split(/\s+/).filter(Boolean).map(x=>x.slice(0,16)).slice(0,400);prev.textContent=p.items.join(' ');cnt.textContent=p.items.length+' / 400';touch()}}),cnt,
        h('label',{},'Preview'),prev);
    }else{
      const pick=h('input',{type:'file',accept:'image/*',multiple:true,style:'display:none',onchange:e=>{addStickers(p,[...e.target.files]);e.target.value=''}});
      const g=h('div',{class:'pgrid'},p.items.map((path,i)=>h('div',{class:'st'},h('img',{src:PREVIEWS.get(path)||('../'+path),alt:'',loading:'lazy'}),h('button',{class:'del',onclick:()=>removePackItem(p,i)},'✕'))));
      ed.append(h('div',{class:'btns'},h('button',{class:'pri',onclick:()=>pick.click()},'+ Add pictures'),pick),
        h('p',{class:'hint'},'Pictures are converted to PNG (max 512 px, under 600 KB). GIFs stay animated (under 600 KB). Max 40 per pack. Saved under docs/packs when you press Publish.'),
        p.items.length?g:h('p',{class:'hint'},'No stickers yet.'),h('div',{class:'hint'},p.items.length+' / 40'));
    }
    ed.append(h('div',{class:'btns'},h('button',{class:'del',onclick:()=>{
      if(!confirm('Delete the pack “'+p.name+'”?'))return;
      if(p.type==='sticker')p.items.forEach(dropUpload);
      cfg.packs.splice(selP,1);selP=Math.max(0,selP-1);touch();draw()}},'Delete pack')));
  }
  v.append(h('div',{class:'grid'},list,ed));
}

/* ---------- controls: effect + language defaults, kill-switch, notice ---------- */
const TOOLS=[['paste','Paste'],['clip','Clipboard'],['sticker','Stickers & GIF maker'],['voice','Voice typing'],['snips','Shortcuts'],['fonts','Fonts & styles'],['calc','Calculator'],['readmore','Read more message'],['divider','Fancy art'],['lock','Secret message'],['date','Date & time'],['bg','Backgrounds'],['effects','Effects'],['theme','Themes'],['keystyle','Key style'],['boom','Boom'],['status','Status saver']];
const LANGS=[['si','සිංහල Sinhala'],['ta','தமிழ் Tamil'],['hi','हिन्दी Hindi'],['te','తెలుగు Telugu'],['ml','മലയാളം Malayalam'],['kn','ಕನ್ನಡ Kannada'],['bn','বাংলা Bengali'],['ar','العربية Arabic']];
const EFFECTS=['Snow ❄','Water drops 💧','Leaves 🍃','Flowers 🌸','Smoke 💨','Fire 🔥','Hearts ❤','Rain 🌧','Fireflies ✨','Bubbles ○','Stars ⭐'];
const AREAS=['Off','Keyboard only','Full screen'];
const COLOURS=['Auto (natural look)','White','Blue','Pink','Yellow','Green','Rainbow'];
function sel(options,value,onchange,keepLabel){
  return h('select',{onchange:e=>onchange(parseInt(e.target.value,10))},h('option',{value:-1,selected:value===-1},keepLabel),options.map((o,i)=>h('option',{value:i,selected:value===i},o)));
}
function toggleIn(arr,key,on){const i=arr.indexOf(key);if(on&&i<0)arr.push(key);if(!on&&i>=0)arr.splice(i,1)}
function renderControls(v){
  const d=cfg.defaults,f=cfg.flags;
  const eff=h('div',{class:'card'},
    h('div',{class:'sec',style:'margin-top:0'},'🎛 Effect defaults'),
    h('p',{class:'hint'},'Choose how the keyboard effect looks for everyone. “Push” sends it once: users can still change it afterwards in the app. Push again later to reset everyone.'),
    h('label',{},'Effect'),sel(EFFECTS,d.effect,x=>{d.effect=x;touch()},'Do not change'),
    h('label',{},'Where'),sel(AREAS,d.area,x=>{d.area=x;touch()},'Do not change'),
    h('label',{},'Colour'),sel(COLOURS,d.color,x=>{d.color=x;touch()},'Do not change'),
    h('div',{class:'btns'},h('button',{class:'pri',onclick:()=>{
      if(d.effect<0&&d.area<0&&d.color<0){alert('Choose at least one thing to push.');return}
      d.rev=(d.rev|0)+1;touch();draw();setStatus('push #'+d.rev+' ready – press Publish','bad')}},'Push to everyone'),
      h('span',{class:'hint'},'Push number now: '+(d.rev|0))));
  const lang=h('div',{class:'card'},
    h('div',{class:'sec',style:'margin-top:0'},'🌐 Languages'),
    h('p',{class:'hint'},'Untick a language to remove it from the keyboard and from the app’s Languages list. English is always there.'),
    h('div',{class:'tools'},LANGS.map(([id,n])=>h('label',{class:'chk'},h('input',{type:'checkbox',checked:!cfg.languages.hidden.includes(id),onchange:e=>{toggleIn(cfg.languages.hidden,id,!e.target.checked);touch()}}),n))));
  const kill=h('div',{class:'card'},
    h('div',{class:'sec',style:'margin-top:0'},'⛔ Kill-switch (turn tools off)'),
    h('p',{class:'hint'},'Untick a tool to hide it from the keyboard for everyone (for example if it has a bug). Tick it again to bring it back. Settings, Emoji, Language, Singlish and News can not be switched off.'),
    h('div',{class:'tools'},TOOLS.map(([id,n])=>h('label',{class:'chk'},h('input',{type:'checkbox',checked:!f.disabled.includes(id),onchange:e=>{toggleIn(f.disabled,id,!e.target.checked);touch()}}),n))));
  const nt=f.notice;
  const note=h('div',{class:'card'},
    h('div',{class:'sec',style:'margin-top:0'},'📢 Notice & minimum version'),
    h('label',{class:'chk'},h('input',{type:'checkbox',checked:nt.on,onchange:e=>{nt.on=e.target.checked;if(!nt.id)nt.id='n'+Date.now().toString(36);touch()}}),'Show a notice (maintenance, warning, info)'),
    h('label',{},'Message (max 240 letters). Shown once as a pop-up on the keyboard, and as a card in the app and the News panel'),
    h('textarea',{value:nt.message,maxlength:240,style:'min-height:80px',oninput:e=>{nt.message=e.target.value;nt.id='n'+Date.now().toString(36);touch()}}),
    h('label',{},'Minimum app version code (0 = off). Older apps get an “Update required” message'),
    h('input',{type:'number',min:0,value:f.minVersion||0,oninput:e=>{f.minVersion=Math.max(0,parseInt(e.target.value||'0',10)||0);touch()}}),
    h('p',{class:'hint'},'Set the update link in the “App update” tab so the message has a button to update. The keyboard keeps working, it only reminds the user.'));
  v.append(h('div',{style:'display:grid;gap:14px;max-width:760px'},eff,lang,kill,note));
}

/* ---------- stats ---------- */
async function ghJson(url){const r=await fetch(url,{headers:hdr(),cache:'no-store'});if(!r.ok)throw new Error(await errText(r));return r.json()}
function stat(n,l){return h('div',{class:'stat'},h('b',{},String(n)),h('span',{},l))}
async function renderStats(v){
  const size=new Blob([buildJson(cfg)]).size,pct=Math.min(100,Math.round(size/2621.44));
  const box=h('div',{class:'card'});
  box.append(h('div',{class:'sec',style:'margin-top:0'},'config.json'),
    h('div',{class:'stats'},stat(cfg.themes.length,'themes'),stat(cfg.news.length,'news posts'),stat(cfg.backgrounds.length,'photo backgrounds'),stat(cfg.videos.length,'video backgrounds'),stat(cfg.packs.length,'packs'),stat(cfg.flags.disabled.length,'tools switched off')),
    h('div',{},'Size: '+(size/1024).toFixed(1)+' KB of 256 KB allowed'),h('div',{class:'bar'+(pct>85?' warn':'')},h('i',{style:'width:'+pct+'%'})),
    h('p',{class:'hint'},'The keyboard ignores a config.json bigger than 256 KB. Pictures and videos are separate files and do not count.'));
  const dl=h('div',{class:'card',style:'margin-top:14px'},h('div',{class:'sec',style:'margin-top:0'},'Downloads (GitHub releases)'),h('p',{class:'hint'},'Loading…'));
  v.append(box,dl);
  try{
    if(!S.owner||!S.repo)throw new Error('Set GitHub first (⚙ GitHub).');
    const api='https://api.github.com/repos/'+encodeURIComponent(S.owner)+'/'+encodeURIComponent(S.repo);
    const [repo,rels]=await Promise.all([ghJson(api),ghJson(api+'/releases?per_page=50')]);
    if(tab!=='stats')return;
    const rows=rels.map(r=>{const apk=(r.assets||[]).find(a=>/\.apk$/i.test(a.name));return{tag:r.tag_name,date:(r.published_at||'').slice(0,10),n:apk?apk.download_count:0}});
    const total=rows.reduce((a,b)=>a+b.n,0);
    const best=rows.slice().sort((a,b)=>b.n-a.n)[0];
    dl.replaceChildren(h('div',{class:'sec',style:'margin-top:0'},'Downloads (GitHub releases)'),
      h('div',{class:'stats'},stat(total,'APK downloads'),stat(rows.length,'releases'),stat(rows[0]?rows[0].tag:'–','latest'),stat(best&&best.n?best.tag:'–','most downloaded'),stat(repo.stargazers_count,'stars'),stat(repo.forks_count,'forks')),
      rows.length?h('table',{},h('thead',{},h('tr',{},h('th',{},'Release'),h('th',{},'Date'),h('th',{},'Downloads'))),h('tbody',{},rows.map(r=>h('tr',{},h('td',{},r.tag),h('td',{},r.date),h('td',{},String(r.n)))))):h('p',{class:'hint'},'No releases yet.'),
      h('p',{class:'hint'},'These are the numbers GitHub counts for the APK file. Updates inside the app are downloads too. The keyboard never sends anything about its users.'));
  }catch(e){dl.replaceChildren(h('div',{class:'sec',style:'margin-top:0'},'Downloads (GitHub releases)'),h('p',{class:'hint'},e.message))}
}

/* ---------- news ---------- */
function renderNews(v){
  const list=h('div',{class:'card'},h('div',{class:'btns',style:'margin:0 0 10px'},h('button',{class:'pri',onclick:()=>{cfg.news.unshift({id:'n'+Date.now().toString(36),title:'',body:'',date:today(),link:'',pinned:false,enabled:true});selN=0;touch();draw()}},'+ New post')));
  cfg.news.forEach((n,i)=>list.append(h('div',{class:'item'+(i===selN?' on':'')+(n.enabled?'':' off'),onclick:()=>{selN=i;draw()}},h('div',{},(n.pinned?'📌 ':'')+(n.title||'(no title)'),h('small',{},n.date+(n.enabled?'':' · hidden'))))));
  if(!cfg.news.length)list.append(h('p',{class:'hint'},'No news yet.'));
  const n=cfg.news[selN];const ed=h('div',{class:'card'});
  if(!n){ed.append(h('p',{class:'hint'},'News shows in the keyboard under the 📰 tool. Users get a small pop-up the next time they open the keyboard.'))}
  else{
    const pv=h('div',{});const upd=()=>pv.replaceChildren(h('div',{class:'news'},h('b',{},n.title||'(title)'),h('small',{},n.date),h('div',{},n.body),n.link?h('small',{},'Tap to open: '+n.link):null));upd();
    ed.append(h('label',{},'Preview'),pv,
      h('label',{},'Title'),h('input',{type:'text',value:n.title,maxlength:80,oninput:e=>{n.title=e.target.value;touch();upd();const it=list.querySelectorAll('.item')[selN];if(it)it.firstChild.firstChild.textContent=(n.pinned?'📌 ':'')+(n.title||'(no title)')}}),
      h('label',{},'Message'),h('textarea',{value:n.body,maxlength:2000,oninput:e=>{n.body=e.target.value;touch();upd()}}),
      h('label',{},'Date'),h('input',{type:'date',value:n.date,onchange:e=>{n.date=e.target.value||today();touch();upd()}}),
      h('label',{},'Link (optional, https only)'),h('input',{type:'text',value:n.link,placeholder:'https://',oninput:e=>{n.link=e.target.value;touch();upd()}}),
      h('label',{class:'chk'},h('input',{type:'checkbox',checked:n.pinned,onchange:e=>{n.pinned=e.target.checked;touch();draw()}}),'Pin to the top'),
      h('label',{class:'chk'},h('input',{type:'checkbox',checked:n.enabled,onchange:e=>{n.enabled=e.target.checked;touch();draw()}}),'Visible in the app'),
      h('div',{class:'btns'},h('button',{class:'del',onclick:()=>{if(confirm('Delete this post?')){cfg.news.splice(selN,1);selN=Math.max(0,selN-1);touch();draw()}}},'Delete')));
  }
  v.append(h('div',{class:'grid'},list,ed));
}

/* ---------- update ---------- */
function renderUpdate(v){
  const u=cfg.update||{versionCode:0,versionName:'',message:'',url:''};
  const set=(k,val)=>{if(!cfg.update)cfg.update={versionCode:0,versionName:'',message:'',url:''};cfg.update[k]=val;touch()};
  const fields=h('div',{});
  const fill=async()=>{
    if(!S.owner||!S.repo){openSettings();return}
    setStatus('checking latest release…');
    try{
      const r=await fetch('https://api.github.com/repos/'+encodeURIComponent(S.owner)+'/'+encodeURIComponent(S.repo)+'/releases/latest',{headers:hdr(),cache:'no-store'});
      if(!r.ok)throw new Error(await errText(r));
      const info=releaseInfo(await r.json());
      if(!info.versionCode||!info.url)throw new Error('The latest release has no number or no .apk file yet.');
      cfg.update=Object.assign({versionCode:0,versionName:'',message:'',url:''},cfg.update||{},info);
      touch();draw();setStatus('filled from the latest release – add a message and Publish','ok');
    }catch(e){setStatus(e.message,'bad')}
  };
  v.append(h('div',{class:'card',style:'max-width:640px'},
    h('p',{class:'hint'},'When the number below is higher than the installed app’s version, the keyboard shows an update card at the top of the News panel. Tapping it downloads the APK and opens Android’s installer (the user still taps Install).'),
    h('div',{class:'btns',style:'margin:0 0 6px'},h('button',{class:'pri',onclick:fill},'Fill from my latest release')),
    h('p',{class:'hint'},'Every build on GitHub Actions makes a release automatically. This button reads its number and APK link for you.'),
    h('label',{},'Version code (number)'),h('input',{type:'number',min:0,value:u.versionCode||'',oninput:e=>set('versionCode',parseInt(e.target.value||'0',10)||0)}),
    h('label',{},'Version name (for example 1.0.12)'),h('input',{type:'text',value:u.versionName,maxlength:20,oninput:e=>set('versionName',e.target.value)}),
    h('label',{},'What is new (short)'),h('textarea',{value:u.message,maxlength:300,oninput:e=>set('message',e.target.value)}),
    h('label',{},'APK link (https). A link ending in .apk gives the download-and-install button'),h('input',{type:'text',value:u.url,placeholder:'https://github.com/…/RIO-BOARD.apk',oninput:e=>set('url',e.target.value)}),
    h('div',{class:'btns'},h('button',{class:'del',onclick:()=>{cfg.update=null;touch();draw()}},'Remove update notice'))));
}

/* ---------- raw ---------- */
function renderRaw(v){
  const ta=h('textarea',{style:'min-height:340px;font:13px ui-monospace,monospace',value:buildJson(cfg),spellcheck:'false'});
  v.append(h('div',{class:'card'},
    h('p',{class:'hint'},'This is exactly what gets saved. You can paste an old config here and press “Use this JSON”.'),ta,
    h('div',{class:'btns'},
      h('button',{onclick:()=>{try{cfg=normalize(JSON.parse(ta.value));selT=0;selN=0;touch();draw()}catch(e){alert('That is not valid JSON: '+e.message)}}},'Use this JSON'),
      h('button',{onclick:()=>{const a=h('a',{href:URL.createObjectURL(new Blob([ta.value],{type:'application/json'})),download:'config.json'});document.body.append(a);a.click();a.remove()}},'Download'))));
}

/* ---------- settings dialog ---------- */
function siteUrl(){const p=S.path.replace(/^docs\//,'');return S.owner&&S.repo?'https://'+S.owner+'.github.io/'+S.repo+'/'+p:'(fill owner and repository)'}
function openSettings(){$('#sOwner').value=S.owner;$('#sRepo').value=S.repo;$('#sBranch').value=S.branch;$('#sPath').value=S.path;$('#sToken').value=S.token;$('#sUrl').textContent=siteUrl();$('#dlg').showModal()}
['sOwner','sRepo','sPath'].forEach(id=>document.addEventListener('input',e=>{if(e.target.id===id){S.owner=$('#sOwner').value.trim();S.repo=$('#sRepo').value.trim();S.path=$('#sPath').value.trim()||'docs/config.json';$('#sUrl').textContent=siteUrl()}}));
$('#sSave').onclick=()=>{S.owner=$('#sOwner').value.trim();S.repo=$('#sRepo').value.trim();S.branch=$('#sBranch').value.trim()||'main';S.path=$('#sPath').value.trim()||'docs/config.json';S.token=$('#sToken').value.trim();saveSettings();$('#dlg').close();load()};
$('#sClose').onclick=()=>$('#dlg').close();
$('#bSet').onclick=openSettings;$('#bLoad').onclick=load;$('#bPub').onclick=publish;
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

loadSettings();draw();
if(S.owner&&S.repo)load();else{setStatus('set GitHub first','bad');openSettings()}
</script>
